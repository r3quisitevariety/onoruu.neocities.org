{% extends "base.html" %} 

{# the "section." option allows for blog post pages to be listed sequentially - thats what this file is for! #}

{% block content %}
<h1 class="title">{{ section.title }}</h1>
<p> WIP </p>
<p><a href="{{ get_url(path="rss.xml", trailing_slash=false) }}">RSS</a></p>
<ul>
    <!-- If you are using pagination, section.pages will be empty.
           You need to use the paginator object -->
    {% for page in section.pages %}
    <li><a href="{{ page.permalink | safe }}">{{ page.title }}</a></li>
    {% endfor %}
</ul>
{% endblock content %}
